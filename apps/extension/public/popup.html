<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SelfRelay</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main class="popup-shell">
    <header class="app-header popup-header">
      <div class="identity"><img class="logo" src="icons/selfrelay-logo.png" alt=""><span>SelfRelay</span></div>
      <button id="stopTracking" class="header-action" type="button" hidden>Dejar de seguir</button>
    </header>

    <div class="popup-body">
      <section id="state" class="current-context" aria-live="polite"></section>

      <section id="worksetSection" class="workset-section" hidden>
        <div class="section-heading">
          <strong>Pestañas del contexto</strong>
          <button id="addTabs" class="text-button add-control" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Añadir</button>
        </div>
        <div id="memberList" class="member-list"></div>
      </section>

      <section id="emptyActions" class="empty-actions" hidden>
        <button id="createContext" class="primary compact action-with-icon" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7.5h12v9H6z"/><path d="M9 5h6M9 19h6"/></svg>Crear contexto</button>
        <button id="addTabsEmpty" class="secondary compact" type="button">Elegir varias pestañas</button>
        <button id="simpleToggle" class="text-button subdued disclosure" type="button">Seguimiento por página o sitio <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
        <div id="simplePanel" class="simple-panel" hidden>
          <div class="segmented small" role="radiogroup" aria-label="Alcance simple">
            <button type="button" data-scope="tab" role="radio" aria-checked="false">Pestaña</button>
            <button type="button" data-scope="url" role="radio" aria-checked="true">Página</button>
            <button type="button" data-scope="site" role="radio" aria-checked="false">Sitio</button>
          </div>
          <button id="simpleFollow" class="secondary compact" type="button">Seguir</button>
        </div>
      </section>

      <section id="tabPicker" class="tab-picker" hidden aria-label="Selector de pestañas">
        <div class="picker-head"><strong>Elegir pestañas</strong><button id="closePicker" class="icon-only" type="button" aria-label="Cerrar selector"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div id="tabList" class="tab-list"></div>
        <div class="picker-foot"><span id="selectionCount" class="helper"></span><button id="saveTabs" class="primary compact" type="button">Guardar selección</button></div>
      </section>

      <div id="popupStatus" class="status popup-status" role="status"></div>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
