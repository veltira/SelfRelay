name: Publish CoderCup Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-codercup-windows.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: codercup-2026
  WINDOWS_VERSION: '0.2.3'
  INSTALLER_SHA256: 0e5ac37d05e719df464928c1a9b2da9aed26c429deca39d541397bc67bb8d91c
  VALIDATED_ARTIFACT_ID: '9500130740'
  CHROME_VERSION: '0.4.3'

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated Windows 0.2.3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATED_ARTIFACT_ID}/zip" \
            > windows-artifact.zip
          unzip -q windows-artifact.zip -d windows-artifact
          test -f windows-artifact/dist/SelfRelay-Setup.exe
          test -f windows-artifact/dist/desktop-package-metadata.txt
          grep -qx "VERSION=${WINDOWS_VERSION}" windows-artifact/dist/desktop-package-metadata.txt
          grep -qx 'TRANSCRIPTION=LOCAL_WHISPER_ASYNC_AUTOMATIC_ON_RECOVERY_WITH_MANUAL_RETRY' windows-artifact/dist/desktop-package-metadata.txt

      - name: Verify exact validated installer
        run: |
          echo "${INSTALLER_SHA256}  windows-artifact/dist/SelfRelay-Setup.exe" | sha256sum --check --strict

      - name: Build browser-friendly Windows ZIP
        run: |
          rm -rf windows-release
          mkdir -p windows-release
          cp windows-artifact/dist/SelfRelay-Setup.exe windows-release/SelfRelay-Setup.exe
          cp windows-artifact/dist/desktop-package-metadata.txt windows-release/desktop-package-metadata.txt
          cat > windows-release/LEEME.txt <<EOF
          SelfRelay Desktop ${WINDOWS_VERSION}

          1. Extrae este ZIP.
          2. Ejecuta SelfRelay-Setup.exe.
          3. SHA-256 del instalador: ${INSTALLER_SHA256}

          SelfRelay utiliza Whisper local para transcribir notas de voz. No requiere tokens ni APIs de IA pagas.

          El instalador no dispone actualmente de una firma Authenticode comercial. Windows SmartScreen puede mostrar una advertencia de aplicación no reconocida hasta que exista reputación de editor/archivo.
          EOF
          (cd windows-release && zip -q -9 ../SelfRelay-Windows-0.2.3.zip SelfRelay-Setup.exe desktop-package-metadata.txt LEEME.txt)

      - name: Publish Windows assets to CoderCup Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title 'SelfRelay — CoderCup 2026' \
              --notes 'Builds de SelfRelay preparadas para evaluación de CoderCup AI 2026.'
          fi
          gh release upload "${RELEASE_TAG}" \
            windows-artifact/dist/SelfRelay-Setup.exe \
            windows-artifact/dist/desktop-package-metadata.txt \
            SelfRelay-Windows-0.2.3.zip \
            --clobber

      - name: Download public Release assets again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-verify
          mkdir -p release-verify
          gh release download "${RELEASE_TAG}" \
            --pattern 'SelfRelay-Setup.exe' \
            --pattern 'SelfRelay-Windows-0.2.3.zip' \
            --pattern 'SelfRelay-Chrome.zip' \
            --dir release-verify
          test -f release-verify/SelfRelay-Setup.exe
          test -f release-verify/SelfRelay-Windows-0.2.3.zip
          test -f release-verify/SelfRelay-Chrome.zip

      - name: Verify Windows public downloads byte-for-byte
        run: |
          echo "${INSTALLER_SHA256}  release-verify/SelfRelay-Setup.exe" | sha256sum --check --strict
          cmp windows-artifact/dist/SelfRelay-Setup.exe release-verify/SelfRelay-Setup.exe
          rm -rf zip-verify
          mkdir zip-verify
          unzip -q release-verify/SelfRelay-Windows-0.2.3.zip -d zip-verify
          echo "${INSTALLER_SHA256}  zip-verify/SelfRelay-Setup.exe" | sha256sum --check --strict
          cmp windows-artifact/dist/SelfRelay-Setup.exe zip-verify/SelfRelay-Setup.exe
          grep -qx "VERSION=${WINDOWS_VERSION}" zip-verify/desktop-package-metadata.txt

      - name: Verify public Chrome package is SelfRelay 0.4.3
        run: |
          unzip -t release-verify/SelfRelay-Chrome.zip >/dev/null
          unzip -p release-verify/SelfRelay-Chrome.zip manifest.json > chrome-manifest.json
          jq -e --arg version "${CHROME_VERSION}" '.name == "SelfRelay" and .version == $version and .manifest_version == 3' chrome-manifest.json
          unzip -Z1 release-verify/SelfRelay-Chrome.zip | grep -qx 'background.js'
          unzip -Z1 release-verify/SelfRelay-Chrome.zip | grep -qx 'vendor/whisper/ggml-base-q5_1.bin'

      - name: Record verified CoderCup Release state in repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          WINDOWS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SelfRelay-Setup.exe"
          WINDOWS_ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SelfRelay-Windows-0.2.3.zip"
          CHROME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SelfRelay-Chrome.zip"
          WINDOWS_SIZE=$(stat -c%s release-verify/SelfRelay-Setup.exe)
          WINDOWS_ZIP_SIZE=$(stat -c%s release-verify/SelfRelay-Windows-0.2.3.zip)
          WINDOWS_ZIP_SHA256=$(sha256sum release-verify/SelfRelay-Windows-0.2.3.zip | awk '{print $1}')
          CHROME_SIZE=$(stat -c%s release-verify/SelfRelay-Chrome.zip)
          CHROME_SHA256=$(sha256sum release-verify/SelfRelay-Chrome.zip | awk '{print $1}')
          mkdir -p docs
          cat > docs/CODERCUP_RELEASE_STATUS.md <<EOF
          # CoderCup Release verification

          This file is generated only after GitHub Actions publishes and re-downloads the public release assets successfully.

          - Release: ${RELEASE_URL}
          - Windows installer: ${WINDOWS_URL}
          - Windows ZIP: ${WINDOWS_ZIP_URL}
          - Windows version: ${WINDOWS_VERSION}
          - Windows installer SHA-256: ${INSTALLER_SHA256}
          - Windows installer size: ${WINDOWS_SIZE} bytes
          - Windows ZIP SHA-256: ${WINDOWS_ZIP_SHA256}
          - Windows ZIP size: ${WINDOWS_ZIP_SIZE} bytes
          - Windows transcription: local Whisper, asynchronous, automatic on recovery with manual retry
          - Chrome: ${CHROME_URL}
          - Chrome version verified from packaged manifest: ${CHROME_VERSION}
          - Chrome SHA-256: ${CHROME_SHA256}
          - Chrome size: ${CHROME_SIZE} bytes
          - Verification commit: ${GITHUB_SHA}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODERCUP_RELEASE_STATUS.md
          git commit -m 'Record verified CoderCup release assets'
          git push
