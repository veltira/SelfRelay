name: SelfRelay Packaging

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-chrome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare local IBM Plex fonts
        run: bash tools/fonts/prepare-fonts.sh
      - name: Prepare local Whisper transcription assets
        run: bash tools/whisper/prepare-browser-runtime.sh
      - run: npm run check
      - name: Validate compiled extension
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('apps/extension/dist/manifest.json','utf8')); if(m.manifest_version!==3||m.name!=='SelfRelay'||m.version!=='0.4.2') process.exit(1); if(!m.permissions.includes('offscreen')) process.exit(1); if(!String(m.content_security_policy?.extension_pages||'').includes('wasm-unsafe-eval')) process.exit(1); if(m.cross_origin_embedder_policy?.value!=='require-corp'||m.cross_origin_opener_policy?.value!=='same-origin') process.exit(1); const resources=m.web_accessible_resources?.flatMap(x=>x.resources||[])||[]; if(!resources.includes('icons/icon32.png')||resources.includes('icons/selfrelay-logo.png')) process.exit(1);"
          test -f apps/extension/dist/background.js
          test -f apps/extension/dist/checkpoint.html
          test -f apps/extension/dist/checkpoint.js
          test -f apps/extension/dist/content.js
          test -f apps/extension/dist/popup.html
          test -f apps/extension/dist/popup.js
          test -f apps/extension/dist/popup-busy.js
          test -f apps/extension/dist/product-polish.css
          test -f apps/extension/dist/audio.html
          test -f apps/extension/dist/audio.js
          test -f apps/extension/dist/offscreen.html
          test -f apps/extension/dist/offscreen.js
          test -f apps/extension/dist/icons/icon16.png
          test -f apps/extension/dist/icons/icon32.png
          test -f apps/extension/dist/icons/icon48.png
          test -f apps/extension/dist/icons/icon128.png
          test ! -f apps/extension/dist/icons/selfrelay-logo.png
          python3 tools/branding/validate-ui-icon.py apps/extension/dist/icons/icon32.png
          test -f apps/extension/dist/fonts/IBMPlexSans-Regular.woff2
          test -f apps/extension/dist/fonts/IBMPlexSans-Medium.woff2
          test -f apps/extension/dist/fonts/IBMPlexSans-SemiBold.woff2
          test -f apps/extension/dist/fonts/IBM-Plex-LICENSE.txt
          test -f apps/extension/dist/vendor/whisper/selfrelay-whisper-worker.js
          test -f apps/extension/dist/vendor/whisper/selfrelay-whisper.js
          test -f apps/extension/dist/vendor/whisper/selfrelay-whisper.wasm
          test -f apps/extension/dist/vendor/whisper/ggml-base-q5_1.bin
          echo '422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  apps/extension/dist/vendor/whisper/ggml-base-q5_1.bin' | sha256sum --check --status
          if grep -R -E 'api\.openai|generativelanguage|deepgram|assemblyai|speech\.googleapis|azure' apps/extension/dist --exclude='*.wasm' --exclude='*.bin'; then
            echo 'Remote transcription endpoint found in packaged extension.' >&2
            exit 1
          fi
      - name: Run popup state machine and capture QA in Chromium
        run: node tools/chrome/product-e2e.mjs apps/extension/dist
      - name: Upload Chrome QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SelfRelay-Chrome-QA
          path: artifacts/chrome-e2e-screenshots
          if-no-files-found: warn
          retention-days: 30
      - name: Run MediaRecorder WebM and packaged Whisper runtime in Chromium
        run: |
          test -f "$RUNNER_TEMP/selfrelay-whisper-build/spanish.wav"
          node tools/chrome/transcription-e2e.mjs apps/extension/dist "$RUNNER_TEMP/selfrelay-whisper-build/spanish.wav"
      - name: Create SelfRelay-Chrome.zip
        run: |
          rm -f SelfRelay-Chrome.zip
          cd apps/extension/dist
          zip -qr ../../../SelfRelay-Chrome.zip .
      - name: Validate ZIP layout and self-contained transcription
        run: |
          unzip -t SelfRelay-Chrome.zip
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'manifest.json'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'background.js'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'icons/icon32.png'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'icons/icon128.png'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'product-polish.css'
          if unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'icons/selfrelay-logo.png'; then
            echo 'Corrupt master branding raster must not be shipped.' >&2
            exit 1
          fi
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'offscreen.html'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'offscreen.js'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'fonts/IBMPlexSans-Regular.woff2'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'fonts/IBMPlexSans-Medium.woff2'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'fonts/IBMPlexSans-SemiBold.woff2'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'fonts/IBM-Plex-LICENSE.txt'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'vendor/whisper/selfrelay-whisper-worker.js'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'vendor/whisper/selfrelay-whisper.js'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'vendor/whisper/selfrelay-whisper.wasm'
          unzip -Z1 SelfRelay-Chrome.zip | grep -qx 'vendor/whisper/ggml-base-q5_1.bin'
          if unzip -Z1 SelfRelay-Chrome.zip | grep -q '^apps/extension/dist/'; then
            echo 'ZIP must contain the extension directly, not the repository path.' >&2
            exit 1
          fi
          du -h SelfRelay-Chrome.zip
      - name: Run packaged Whisper reuse, reload and zero-error gate
        run: |
          rm -rf "$RUNNER_TEMP/selfrelay-packaged-extension"
          mkdir -p "$RUNNER_TEMP/selfrelay-packaged-extension"
          unzip -q SelfRelay-Chrome.zip -d "$RUNNER_TEMP/selfrelay-packaged-extension"
          node tools/chrome/transcription-lifecycle-e2e.mjs "$RUNNER_TEMP/selfrelay-packaged-extension" "$RUNNER_TEMP/selfrelay-whisper-build/spanish.wav"
      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: SelfRelay-Chrome-package
          path: SelfRelay-Chrome.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-chrome
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged Chrome extension
        uses: actions/download-artifact@v4
        with:
          name: SelfRelay-Chrome-package
          path: release
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/SelfRelay-Chrome.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/SelfRelay-Chrome.zip --verify-tag --generate-notes --title "SelfRelay $GITHUB_REF_NAME"
          fi
