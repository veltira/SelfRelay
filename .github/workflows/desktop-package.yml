name: Desktop Package

on:
  push:
    branches:
      - "desktop/**"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-package.yml"
  pull_request:
    branches:
      - main
      - "desktop/**"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate final Desktop branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"
          python apps/desktop/scripts/generate-branding.py
      - name: Prepare pinned local Whisper runtime
        shell: pwsh
        run: apps/desktop/scripts/prepare-whisper-runtime.ps1
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Build native upgrade fixture
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --bin selfrelay-window-fixture
      - name: Build NSIS 0.2.0 release
        working-directory: apps/desktop
        run: npm run tauri:build

      - name: Verify final Windows GUI binary identity
        shell: pwsh
        run: |
          function Get-PESubsystem([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 256) { throw "PE file is unexpectedly small: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or ($peOffset + 96) -ge $bytes.Length) { throw "Invalid PE header offset: $Path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw "Missing PE signature: $Path" }
            $optionalHeader = $peOffset + 24
            return [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          }
          $appExe = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/SelfRelay.exe"
          $oldExe = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/selfrelay-desktop-core.exe"
          if (-not (Test-Path $appExe)) { throw "Release SelfRelay.exe not found: $appExe" }
          if (Test-Path $oldExe) { throw "Historical selfrelay-desktop-core.exe was emitted by final release" }
          $subsystem = Get-PESubsystem $appExe
          Write-Host "SelfRelay.exe release PE subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "SelfRelay.exe must use IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem" }
          $signature = Get-AuthenticodeSignature $appExe
          Write-Host "SelfRelay.exe Authenticode: $($signature.Status); signer=$($signature.SignerCertificate.Subject)"

      - name: Normalize installer before installed-product QA
        shell: pwsh
        run: |
          $config = Get-Content (Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json") -Raw | ConvertFrom-Json
          if ($config.version -ne "0.2.0") { throw "Unexpected Desktop product version: $($config.version)" }
          $nsis = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*.exe" -File | Where-Object Name -Match "0\.2\.0" | Select-Object -First 1
          if (-not $installer) { throw "No 0.2.0 NSIS installer was produced" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $installer.FullName (Join-Path $dist "SelfRelay-Setup.exe") -Force

      - name: Upgrade, installed binary, single-instance and uninstall QA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop-upgrade-qa | Out-Null
          apps/desktop/scripts/upgrade-qa.ps1 `
            -Installer "$env:GITHUB_WORKSPACE\dist\SelfRelay-Setup.exe" `
            -Fixture "$env:GITHUB_WORKSPACE\apps\desktop\src-tauri\target\release\selfrelay-window-fixture.exe" `
            -Report "$env:GITHUB_WORKSPACE\artifacts\desktop-upgrade-qa\upgrade-qa.txt"
      - name: Upload upgrade QA
        uses: actions/upload-artifact@v4
        with:
          name: SelfRelay-Desktop-Upgrade-QA
          path: artifacts/desktop-upgrade-qa
          if-no-files-found: error
          retention-days: 14

      - name: Emit package metadata
        shell: pwsh
        run: |
          function Get-PESubsystem([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          }
          function Signature-Label($Signature) {
            if ($null -eq $Signature.SignerCertificate) { return "UNSIGNED" }
            return "SIGNED"
          }
          $version = "0.2.0"
          $appExe = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/SelfRelay.exe"
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist/SelfRelay-Setup.exe"
          $appSignature = Get-AuthenticodeSignature $appExe
          $installerSignature = Get-AuthenticodeSignature $installer
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize = (Get-Item $installer).Length
          $metadata = @(
            "VERSION=$version"
            "APPLICATION_BINARY=SelfRelay.exe"
            "APP_PE_SUBSYSTEM=$(Get-PESubsystem $appExe)"
            "APP_SIGNATURE=$(Signature-Label $appSignature)"
            "APP_SIGNATURE_STATUS=$($appSignature.Status)"
            "INSTALLER_PE_SUBSYSTEM=$(Get-PESubsystem $installer)"
            "INSTALLER_SIGNATURE=$(Signature-Label $installerSignature)"
            "INSTALLER_SIGNATURE_STATUS=$($installerSignature.Status)"
            "INSTALLER_SIZE=$installerSize"
            "INSTALLER_SHA256=$installerHash"
            "WHISPER_RUNTIME=LOCAL_ON_DEMAND"
          )
          $metadata | ForEach-Object { Write-Host $_ }
          $metadata | Set-Content (Join-Path $env:GITHUB_WORKSPACE "dist/desktop-package-metadata.txt") -Encoding utf8

      - name: Upload Windows 0.2.0 product candidate
        uses: actions/upload-artifact@v4
        with:
          name: SelfRelay-Windows-Installer-0.2.0
          path: |
            dist/SelfRelay-Setup.exe
            dist/desktop-package-metadata.txt
            apps/desktop/src-tauri/resources/whisper/runtime-metadata.txt
          if-no-files-found: error
          retention-days: 14
