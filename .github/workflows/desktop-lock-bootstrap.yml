name: Desktop lock bootstrap

on:
  push:
    branches:
      - desktop/d0-windows-foundation
    paths:
      - apps/desktop/package.json
      - apps/desktop/src-tauri/Cargo.toml
      - .github/workflows/desktop-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop/d0-windows-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        working-directory: apps/desktop
        run: npm install --package-lock-only --workspaces=false --ignore-scripts --no-audit --no-fund
      - name: Generate Cargo lockfile
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile
      - name: Commit lockfiles
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/desktop/package-lock.json")) { throw "package-lock.json was not generated" }
          if (-not (Test-Path "apps/desktop/src-tauri/Cargo.lock")) { throw "Cargo.lock was not generated" }
          git add apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock
          if (git diff --cached --quiet) {
            Write-Host "Lockfiles already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "desktop: lock frontend and Rust dependencies"
          git push origin HEAD:desktop/d0-windows-foundation
