name: Desktop icon bootstrap

on:
  push:
    branches:
      - desktop/d0-windows-foundation
    paths:
      - .github/workflows/desktop-icon-bootstrap.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop-icon-bootstrap.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop/d0-windows-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Desktop tooling
        working-directory: apps/desktop
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Prepare square source from official SelfRelay logo
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "apps/desktop/src-tauri/icons" | Out-Null
          $source = [System.Drawing.Image]::FromFile((Resolve-Path "assets/branding/selfrelay-logo.png"))
          try {
            $size = [Math]::Max($source.Width, $source.Height)
            $bitmap = New-Object System.Drawing.Bitmap($size, $size)
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $x = [int](($size - $source.Width) / 2)
                $y = [int](($size - $source.Height) / 2)
                $graphics.DrawImage($source, $x, $y, $source.Width, $source.Height)
              } finally {
                $graphics.Dispose()
              }
              $bitmap.Save((Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/icons/source.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $bitmap.Dispose()
            }
          } finally {
            $source.Dispose()
          }
      - name: Generate Tauri icon set
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/icons/source.png
      - name: Commit generated Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/desktop/src-tauri/icons/icon.ico")) { throw "icon.ico was not generated" }
          Remove-Item "apps/desktop/src-tauri/icons/source.png" -ErrorAction SilentlyContinue
          git add apps/desktop/src-tauri/icons
          if (git diff --cached --quiet) {
            Write-Host "Windows icon already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "desktop: add Windows icon from official branding"
          git push origin HEAD:desktop/d0-windows-foundation
