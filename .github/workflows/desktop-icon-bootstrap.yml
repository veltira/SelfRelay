name: Desktop icon bootstrap

on:
  push:
    branches:
      - desktop/d0-windows-foundation
    paths:
      - .github/workflows/desktop-icon-bootstrap.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop/d0-windows-foundation
      - name: Convert official SelfRelay logo to Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/desktop/src-tauri/icons" | Out-Null
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            throw "ImageMagick is not available on windows-latest"
          }
          magick "assets/branding/selfrelay-logo.png" -background none -define icon:auto-resize=256,128,64,48,32,16 "apps/desktop/src-tauri/icons/icon.ico"
          if (-not (Test-Path "apps/desktop/src-tauri/icons/icon.ico")) {
            throw "icon.ico was not generated"
          }
      - name: Commit generated icon
        shell: pwsh
        run: |
          git add apps/desktop/src-tauri/icons/icon.ico
          if (git diff --cached --quiet) {
            Write-Host "Windows icon already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "desktop: add Windows icon from official branding"
          git push origin HEAD:desktop/d0-windows-foundation
