name: Apply Desktop 0.2.4 Final

on:
  push:
    branches:
      - final/desktop-0.2.4
    paths:
      - scripts/finalize_desktop_024.py
      - .github/workflows/apply-desktop-024-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/desktop-0.2.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply deterministic final patch
        run: python scripts/finalize_desktop_024.py
      - name: Refresh npm lock metadata
        working-directory: apps/desktop
        run: npm install --package-lock-only --workspaces=false --no-audit --no-fund
      - name: Prepare CI resource placeholder
        shell: pwsh
        run: ./apps/desktop/scripts/prepare-ci-resources.ps1
      - name: Compile Rust with in-process Whisper
        working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Typecheck frontend
        working-directory: apps/desktop
        run: |
          npm ci --workspaces=false --no-audit --no-fund
          npm run typecheck
      - name: Remove one-shot patch machinery
        shell: pwsh
        run: |
          Remove-Item scripts/finalize_desktop_024.py -Force
          Remove-Item .github/workflows/apply-desktop-024-final.yml -Force
      - name: Commit finalized source and lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Desktop 0.2.4 history and in-process transcription"
          git push
